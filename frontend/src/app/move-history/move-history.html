<section class="history-panel">
  <h3>Move History</h3>
  @if (moves().length === 0) {
    <p class="empty">No moves yet.</p>
  } @else {
    <div class="history-table" role="table" aria-label="Move history">
      <div class="history-row header" role="row">
        <span role="columnheader">Move</span>
        <span role="columnheader">Player</span>
        <span role="columnheader">Position</span>
      </div>
      @for (move of moves(); track move.number) {
        <div class="history-row" role="row">
          <span role="cell">{{ move.number }}</span>
          <span role="cell" [class.x]="move.player === 'X'" [class.o]="move.player === 'O'">{{ move.player }}</span>
          <span role="cell">{{ positionLabel(move.cell) }}</span>
        </div>
      }
    </div>
  }
</section>
